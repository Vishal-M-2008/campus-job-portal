apiVersion: batch/v1
kind: Job
metadata:
  name: campus-migrate
  namespace: campus
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: campus-api:local
          command: ["npx", "knex", "migrate:latest"]
          workingDir: /app/apps/api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-migrate
          image: busybox:1.36
          command: ["sh", "-c", "echo migrate job is applied before this rollout"]
      containers:
        - name: api
          image: campus-api:local
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: PASSWORD_PEPPER
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: campus
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: campus-web:local
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: campus
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus
  namespace: campus
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
